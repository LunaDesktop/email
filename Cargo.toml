[package]
name = "luna-email"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Mail — klasyczny klient poczty (IMAP/SMTP) dla środowiska Luna."

[workspace]
resolver = "2"

[dependencies]
libluna-core = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-i18n = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-render = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-platform = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-widgets = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }

# Backend poczty (Pimalaya). `imap` daje odbiór i foldery, `smtp` wysyłkę.
email-lib = { version = "0.27", features = ["imap", "smtp"] }
# `PasswordConfig` opakowuje `Secret` z tej samej wersji — typ musi się zgadzać.
secret-lib = { version = "1", default-features = false, features = ["command"] }
# Budowanie nagłówków MIME do wysyłki.
mail-builder = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Powiadomienia systemowe przez sesyjną magistralę (serwer: luna-shell).
zbus = { version = "5.19", features = ["blocking-api"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
